<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Meeting Minutes — 회의록</title>
<style>
:root {
  --primary:   #5B5FEF;
  --primary-l: #EBEBFF;
  --green:     #10B981;
  --green-l:   #ECFDF5;
  --red:       #EF4444;
  --red-l:     #FEF2F2;
  --orange:    #F59E0B;
  --orange-l:  #FFFBEB;

  --gray-900: #111827; --gray-800: #1F2937; --gray-700: #374151;
  --gray-600: #4B5563; --gray-500: #6B7280; --gray-400: #9CA3AF;
  --gray-300: #D1D5DB; --gray-200: #E5E7EB; --gray-100: #F3F4F6;
  --gray-50:  #F9FAFB; --white: #FFFFFF;

  --bg: #F3F4F6; --card: #FFFFFF; --text: #111827;
  --sub: #6B7280; --border: #E5E7EB;

  --radius-s: 8px; --radius-m: 12px; --radius-l: 16px;
  --shadow-s: 0 1px 3px rgba(0,0,0,.08);
  --shadow-m: 0 4px 16px rgba(0,0,0,.08);
  --nav-h: 64px; --top-h: 56px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  font-size: 14px;
  line-height: 1.5;
}
#app { display: flex; flex-direction: column; height: 100vh; max-width: 480px; margin: 0 auto; background: var(--bg); }

/* Top Bar */
#topbar {
  background: var(--card); border-bottom: 1px solid var(--border);
  padding: 0 16px; height: var(--top-h);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0; z-index: 10;
}
#topbar h1 { font-size: 17px; font-weight: 700; }
#topbar-right { display: flex; gap: 8px; }

#main { flex: 1; overflow-y: auto; padding-bottom: calc(var(--nav-h) + 8px); }
.page { display: none; padding: 16px; }
.page.active { display: block; }

/* Bottom Nav */
#bottom-nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; height: var(--nav-h);
  background: var(--card); border-top: 1px solid var(--border);
  display: flex; z-index: 10;
}
.nav-btn {
  flex: 1; background: none; border: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; cursor: pointer; color: var(--gray-400);
  font-size: 11px; font-weight: 600; transition: color .15s;
}
.nav-btn.active { color: var(--primary); }
.nav-icon { font-size: 22px; line-height: 1; }

/* Cards */
.card { background: var(--card); border-radius: var(--radius-l); padding: 16px; box-shadow: var(--shadow-s); margin-bottom: 12px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; padding: 11px 18px; border-radius: var(--radius-m);
  border: none; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all .15s; font-family: inherit;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { opacity: .88; }
.btn-outline { background: none; border: 1.5px solid var(--border); color: var(--text); }
.btn-outline:hover { background: var(--gray-50); }
.btn-danger { background: var(--red); color: #fff; }
.btn-sm { padding: 7px 13px; font-size: 13px; }
.btn-full { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* Record */
#record-area { display: flex; flex-direction: column; align-items: center; padding: 32px 0 20px; }
#record-btn {
  width: 100px; height: 100px; border-radius: 50%; border: none;
  background: var(--red); box-shadow: 0 4px 24px rgba(239,68,68,.35);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 38px; transition: all .15s;
}
#record-btn:hover { transform: scale(1.04); }
#record-btn.recording { animation: pulse 1.6s ease-in-out infinite; }
#record-btn.paused { background: var(--orange); box-shadow: 0 4px 20px rgba(245,158,11,.3); }
#record-btn.idle   { background: var(--gray-300); box-shadow: none; }
@keyframes pulse {
  0%,100% { box-shadow: 0 4px 24px rgba(239,68,68,.35); }
  50%      { box-shadow: 0 4px 48px rgba(239,68,68,.65); transform: scale(1.04); }
}
#timer { font-size: 34px; font-weight: 700; margin: 16px 0 6px; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
#record-status { font-size: 14px; color: var(--sub); text-align: center; max-width: 280px; min-height: 20px; }

/* Waveform animation */
.wave-bar { display: inline-block; width: 4px; border-radius: 2px; background: var(--red); margin: 0 2px; animation: wave 1s ease-in-out infinite; }
.wave-bar:nth-child(2) { animation-delay: .1s; }
.wave-bar:nth-child(3) { animation-delay: .2s; }
.wave-bar:nth-child(4) { animation-delay: .3s; }
.wave-bar:nth-child(5) { animation-delay: .4s; }
@keyframes wave { 0%,100%{height:6px;opacity:.4} 50%{height:20px;opacity:1} }
#wave-indicator { display: none; align-items: flex-end; height: 24px; margin-top: 8px; }
#wave-indicator.active { display: flex; }

/* Live transcript */
#live-transcript-card { display: none; }
#live-transcript {
  font-size: 13px; color: var(--gray-600); line-height: 1.7;
  max-height: 120px; overflow-y: auto; word-break: break-word;
  background: var(--gray-50); border-radius: var(--radius-s); padding: 10px 12px;
}
.speech-unavail { font-size: 13px; color: var(--orange); background: var(--orange-l); border-radius: var(--radius-s); padding: 10px 12px; margin-top: 8px; }

/* Processing */
.progress-step { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); }
.progress-step:last-child { border-bottom: none; }
.step-icon { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; }
.step-icon.waiting { background: var(--gray-100); color: var(--gray-400); }
.step-icon.running { background: var(--primary-l); color: var(--primary); animation: spin 1s linear infinite; }
.step-icon.done    { background: var(--green-l); color: var(--green); }
.step-icon.error   { background: var(--red-l); color: var(--red); }
@keyframes spin { to { transform: rotate(360deg); } }
.step-label { font-size: 14px; font-weight: 600; }
.step-desc  { font-size: 12px; color: var(--sub); margin-top: 1px; }

/* Transcript */
.transcript-box { background: var(--gray-50); border-radius: var(--radius-m); padding: 14px; max-height: 240px; overflow-y: auto; font-size: 14px; color: var(--gray-700); line-height: 1.75; white-space: pre-wrap; word-break: break-word; }

/* Markdown */
.md-body { font-size: 14px; line-height: 1.85; }
.md-body h1 { font-size: 20px; font-weight: 700; margin: 6px 0 10px; }
.md-body h2 { font-size: 16px; font-weight: 700; margin: 18px 0 8px; padding-bottom: 5px; border-bottom: 1.5px solid var(--border); }
.md-body h3 { font-size: 15px; font-weight: 600; margin: 14px 0 5px; color: var(--gray-700); }
.md-body p  { margin: 4px 0; color: var(--gray-700); }
.md-body ul, .md-body ol { margin: 4px 0 4px 20px; color: var(--gray-700); }
.md-body li { margin: 3px 0; }
.md-body table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px; }
.md-body th { background: var(--gray-100); font-weight: 700; text-align: left; }
.md-body th, .md-body td { border: 1px solid var(--border); padding: 7px 10px; }
.md-body hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
.md-body strong { font-weight: 700; color: var(--text); }
.md-body em { font-style: italic; }
.md-body code { background: var(--gray-100); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

/* Meeting List */
.meeting-item {
  background: var(--card); border-radius: var(--radius-l); padding: 14px 16px;
  margin-bottom: 10px; cursor: pointer; transition: all .15s;
  box-shadow: var(--shadow-s); display: flex; align-items: center; gap: 12px;
}
.meeting-item:hover { box-shadow: var(--shadow-m); transform: translateY(-1px); }
.meeting-ico  { font-size: 28px; flex-shrink: 0; }
.meeting-info { flex: 1; min-width: 0; }
.meeting-title { font-size: 15px; font-weight: 600; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meeting-meta  { font-size: 12px; color: var(--sub); }
.meeting-arrow { color: var(--gray-300); font-size: 20px; }

/* Downloads */
.dl-btns { display: flex; gap: 8px; }
.dl-btn { flex: 1; padding: 12px 6px; border-radius: var(--radius-m); border: 1.5px solid var(--border); background: var(--card); cursor: pointer; text-align: center; transition: all .15s; }
.dl-btn:hover { border-color: var(--primary); background: var(--primary-l); }
.dl-btn:active { transform: scale(.97); }
.dl-icon  { font-size: 22px; display: block; margin-bottom: 4px; }
.dl-label { font-size: 11px; font-weight: 700; color: var(--sub); }

/* Empty */
.empty-state { text-align: center; padding: 60px 20px; }
.empty-ico  { font-size: 52px; margin-bottom: 14px; }
.empty-text { font-size: 16px; font-weight: 600; color: var(--gray-600); margin-bottom: 6px; }
.empty-sub  { font-size: 13px; color: var(--gray-400); }

/* Toast */
#toast {
  position: fixed; bottom: calc(var(--nav-h) + 16px); left: 50%; transform: translateX(-50%);
  background: var(--gray-800); color: #fff; padding: 10px 22px; border-radius: 999px;
  font-size: 14px; font-weight: 500; white-space: nowrap; z-index: 200;
  opacity: 0; transition: opacity .25s; pointer-events: none;
}
#toast.show { opacity: 1; }

/* Settings */
.setting-section { margin-bottom: 20px; }
.section-label { font-size: 12px; font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 10px; }
.setting-card { background: var(--card); border-radius: var(--radius-l); overflow: hidden; box-shadow: var(--shadow-s); margin-bottom: 8px; }
.setting-row { padding: 13px 16px; border-bottom: 1px solid var(--border); }
.setting-row:last-child { border-bottom: none; }
.setting-row label { font-size: 14px; font-weight: 600; display: block; margin-bottom: 8px; }
.setting-row input {
  width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
  border-radius: var(--radius-s); font-size: 13px; background: var(--gray-50);
  color: var(--text); outline: none; font-family: monospace; transition: border-color .15s;
}
.setting-row input:focus { border-color: var(--primary); background: #fff; }
.setting-hint { font-size: 12px; color: var(--sub); margin-top: 6px; }

/* Tabs */
.tab-group { display: flex; gap: 4px; background: var(--gray-100); border-radius: var(--radius-m); padding: 4px; margin-bottom: 14px; }
.tab { flex: 1; padding: 8px; border: none; background: none; border-radius: var(--radius-s); font-size: 13px; font-weight: 600; cursor: pointer; color: var(--sub); transition: all .15s; font-family: inherit; }
.tab.active { background: #fff; color: var(--text); box-shadow: var(--shadow-s); }

#minutes-edit { width: 100%; min-height: 420px; padding: 14px; border: 1.5px solid var(--border); border-radius: var(--radius-m); font-size: 13px; line-height: 1.75; resize: vertical; font-family: 'Courier New', monospace; outline: none; background: var(--gray-50); color: var(--text); transition: border-color .15s; }
#minutes-edit:focus { border-color: var(--primary); background: #fff; }

.alert { padding: 12px 14px; border-radius: var(--radius-m); margin-bottom: 12px; font-size: 13px; }
.alert-info  { background: var(--primary-l); color: #1E3A8A; border-left: 3px solid var(--primary); }
.alert-green { background: var(--green-l);   color: #065F46; border-left: 3px solid var(--green); }

#pdf-content { position: fixed; left: -9999px; top: 0; width: 794px; background: #fff; padding: 50px; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif; font-size: 13px; line-height: 1.85; display: none; }

@media (min-width: 480px) { #app { box-shadow: 0 0 60px rgba(0,0,0,.1); } }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <h1 id="topbar-title">🎙️ Meeting Minutes</h1>
    <div id="topbar-right"></div>
  </header>

  <div id="main">

    <!-- HOME -->
    <div id="page-home" class="page active">
      <div id="home-content"></div>
    </div>

    <!-- RECORD -->
    <div id="page-record" class="page">
      <div id="record-area">
        <button id="record-btn" onclick="toggleRecording()">🎙️</button>
        <div id="wave-indicator">
          <span class="wave-bar"></span><span class="wave-bar"></span>
          <span class="wave-bar"></span><span class="wave-bar"></span>
          <span class="wave-bar"></span>
        </div>
        <div id="timer">00:00</div>
        <div id="record-status">버튼을 눌러 녹음을 시작하세요</div>
      </div>

      <div id="live-transcript-card" class="card">
        <div class="section-label" style="margin-bottom:8px">🎤 실시간 전사</div>
        <div id="live-transcript">말하면 여기에 텍스트가 나타납니다...</div>
      </div>

      <div id="record-controls" style="display:none">
        <div style="display:flex;gap:10px;justify-content:center;margin-bottom:16px">
          <button class="btn btn-danger" onclick="stopAndProcess()">⏹ 완료</button>
          <button class="btn btn-outline" onclick="cancelRecording()">취소</button>
        </div>
      </div>

      <div id="processing-card" class="card" style="display:none">
        <div class="section-label" style="margin-bottom:10px">처리 중</div>
        <div id="processing-steps"></div>
      </div>

      <div id="transcript-card" class="card" style="display:none">
        <div class="section-label" style="margin-bottom:10px">📝 녹취록</div>
        <div id="transcript-box" class="transcript-box"></div>
        <div style="margin-top:12px">
          <button class="btn btn-primary btn-full" id="gen-btn" onclick="retryMinutes()">✨ 회의록 다시 생성</button>
        </div>
      </div>
    </div>

    <!-- VIEW -->
    <div id="page-view" class="page">
      <div id="view-content"></div>
    </div>

    <!-- SETTINGS -->
    <div id="page-settings" class="page">
      <div class="alert alert-green">✅ Claude AI가 회의록을 자동 작성합니다.</div>
      <div class="alert alert-info">🔑 Anthropic API 키를 입력하면 바로 사용 가능합니다.</div>

      <div class="setting-section">
        <div class="section-label">API 키 설정</div>
        <div class="setting-card">
          <div class="setting-row">
            <label>🤖 Anthropic API Key</label>
            <input type="password" id="set-anthropic-key" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
            <div class="setting-hint">
              발급: <strong>console.anthropic.com</strong> → API Keys → Create Key<br>
              브라우저에만 저장됩니다. Claude Haiku 사용 (저렴함)
            </div>
          </div>
        </div>
        <button class="btn btn-primary btn-full" onclick="saveSettings()" style="margin-top:4px">저장</button>
      </div>

      <div class="setting-section">
        <div class="section-label">데이터</div>
        <div class="setting-card">
          <div class="setting-row">
            <label>저장된 회의록</label>
            <p id="meetings-count" style="font-size:14px;color:var(--sub);margin-bottom:10px"></p>
            <button class="btn btn-outline btn-full" style="color:var(--red);border-color:var(--red)" onclick="clearAll()">🗑️ 모든 회의록 삭제</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <nav id="bottom-nav">
    <button class="nav-btn active" id="nav-home" onclick="goPage('home')">
      <span class="nav-icon">🏠</span>홈
    </button>
    <button class="nav-btn" id="nav-record" onclick="goPage('record')">
      <span class="nav-icon">🎙️</span>녹음
    </button>
    <button class="nav-btn" id="nav-settings" onclick="goPage('settings')">
      <span class="nav-icon">⚙️</span>설정
    </button>
  </nav>
</div>

<div id="toast"></div>
<div id="pdf-content"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
// ════════════════════════════════════════
// STATE
// ════════════════════════════════════════
const S = {
  page: 'home',
  recording: false,
  processing: false,
  timerSec: 0,
  timerInterval: null,
  mediaRecorder: null,
  audioChunks: [],
  stream: null,
  recognition: null,
  speechTranscript: '',
  currentDuration: 0,
  currentMeeting: null,
  meetings: [],
  anthropicKey: '',
  viewMode: 'view',
};

// ════════════════════════════════════════
// INIT
// ════════════════════════════════════════
function init() {
  S.anthropicKey = localStorage.getItem('ma_anthropic_key') || '';
  S.meetings     = JSON.parse(localStorage.getItem('ma_meetings') || '[]');
  renderHome();
  updateSettingsCount();
}

// ════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════
function goPage(id, meeting) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  const nb = document.getElementById('nav-' + id);
  if (nb) nb.classList.add('active');
  S.page = id;
  const title = document.getElementById('topbar-title');
  const right = document.getElementById('topbar-right');
  right.innerHTML = '';
  if (id === 'home') {
    title.textContent = '🎙️ Meeting Minutes'; renderHome();
  } else if (id === 'record') {
    title.textContent = '새 회의 녹음'; resetRecordPage();
  } else if (id === 'view') {
    S.currentMeeting = meeting || S.currentMeeting;
    S.viewMode = 'view';
    title.textContent = '회의록';
    right.innerHTML = '<button class="btn btn-sm btn-outline" onclick="goPage(\'home\')">← 목록</button>';
    renderView();
  } else if (id === 'settings') {
    title.textContent = '설정'; renderSettings();
  }
  document.getElementById('main').scrollTop = 0;
}

// ════════════════════════════════════════
// HOME
// ════════════════════════════════════════
function renderHome() {
  const el = document.getElementById('home-content');
  if (S.meetings.length === 0) {
    el.innerHTML = `<div class="empty-state">
      <div class="empty-ico">📋</div>
      <div class="empty-text">저장된 회의록이 없습니다</div>
      <div class="empty-sub">아래 녹음 탭에서 새 회의를 시작하세요</div>
    </div>`; return;
  }
  const sorted = [...S.meetings].sort((a, b) => b.createdAt - a.createdAt);
  el.innerHTML = `<div class="section-label">${S.meetings.length}개의 회의록</div>
    ${sorted.map(m => `
      <div class="meeting-item" onclick="goPage('view', getMeeting('${m.id}'))">
        <div class="meeting-ico">📄</div>
        <div class="meeting-info">
          <div class="meeting-title">${escHtml(m.title || '제목 없음')}</div>
          <div class="meeting-meta">${fmtDate(m.createdAt)} &middot; ${fmtDuration(m.duration)}</div>
        </div>
        <div class="meeting-arrow">›</div>
      </div>`).join('')}`;
}
function getMeeting(id) { return S.meetings.find(m => m.id === id); }

// ════════════════════════════════════════
// RECORD PAGE
// ════════════════════════════════════════
function resetRecordPage() {
  stopMediaTracks();
  stopSpeechRecognition();
  S.recording = false; S.audioChunks = []; S.speechTranscript = '';
  S.timerSec = 0; S.currentDuration = 0;
  clearInterval(S.timerInterval);
  setRecordBtn('', '🎙️');
  document.getElementById('timer').textContent = '00:00';
  document.getElementById('record-status').textContent = '버튼을 눌러 녹음을 시작하세요';
  document.getElementById('wave-indicator').classList.remove('active');
  document.getElementById('live-transcript-card').style.display = 'none';
  document.getElementById('live-transcript').textContent = '말하면 여기에 텍스트가 나타납니다...';
  document.getElementById('record-controls').style.display = 'none';
  document.getElementById('processing-card').style.display = 'none';
  document.getElementById('transcript-card').style.display = 'none';
}

async function toggleRecording() {
  if (S.processing) return;
  if (!S.recording) {
    if (!S.anthropicKey) {
      showToast('설정에서 Anthropic API 키를 먼저 입력해주세요');
      goPage('settings');
      return;
    }
    await startRecording();
  } else {
    pauseRecording();
  }
}

async function startRecording() {
  try {
    S.stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch (err) {
    showToast(err.name === 'NotAllowedError' ? '마이크 권한이 필요합니다' : '마이크 오류: ' + err.message);
    return;
  }
  S.audioChunks = [];
  S.speechTranscript = '';
  const mimeType = getBestMimeType();
  S.mediaRecorder = new MediaRecorder(S.stream, mimeType ? { mimeType } : {});
  S.mediaRecorder.ondataavailable = e => { if (e.data.size > 0) S.audioChunks.push(e.data); };
  S.mediaRecorder.start(1000);
  S.recording = true; S.timerSec = 0;

  const hasSpeech = startSpeechRecognition();
  setRecordBtn('recording', '⏸');

function getBestMimeType() {

  return types.find(t => MediaRecorder.isTypeSupported(t)) || '';

async function stopAndProcess() {
  clearInterval(S.timerInterval);
  const duration = S.timerSec;
  S.recording = false;
  stopSpeechRecognition();
  document.getElementById('wave-indicator').classList.remove('active');
  document.getElementById('live-transcript-card').style.display = 'none';

  // Stop MediaRecorder
  await new Promise(resolve => {
    const finish = () => {
      if (S.stream) S.stream.getTracks().forEach(t => t.stop());
      resolve();
    };
    if (!S.mediaRecorder || S.mediaRecorder.state === 'inactive') { finish(); return; }
    S.mediaRecorder.onstop = finish;
    S.mediaRecorder.stop();
  });

  S.currentDuration = duration;
  const transcript = S.speechTranscript.trim();

  if (!transcript) {
    document.getElementById('record-status').textContent = '음성이 인식되지 않았습니다. 다시 시도해주세요.';
    setRecordBtn('', '🎙️');
    showToast('음성을 인식하지 못했습니다');
    return;
  }

  S.processing = true;
  setRecordBtn('idle', '⏳');
  document.getElementById('record-controls').style.display = 'none';

  // Show transcript
  document.getElementById('transcript-box').textContent = transcript;
  document.getElementById('transcript-card').style.display = 'block';
  document.getElementById('gen-btn').style.display = 'none';

  // Generate minutes
  showProcessing([
    { id: 'step-min', label: 'Claude AI 회의록 작성', desc: 'Claude Haiku가 회의록을 작성 중...', status: 'running' },
  ]);
  document.getElementById('record-status').textContent = 'Claude가 회의록을 작성 중...';

  try {
    const minutes = await generateWithClaude(transcript);
    updateStep('step-min', 'done');
    const meeting = saveMeeting({ transcript, minutes, duration, createdAt: Date.now() });
    document.getElementById('record-status').textContent = '✅ 회의록 완성!';
    showToast('회의록이 저장되었습니다');
    S.processing = false;
    setTimeout(() => goPage('view', meeting), 800);
  } catch (err) {
    updateStep('step-min', 'error', err.message);
    document.getElementById('record-status').textContent = '오류: ' + err.message;
    document.getElementById('gen-btn').style.display = '';
    S.processing = false;
  }
  setRecordBtn('', '🎙️');
}

async function retryMinutes() {
  if (!S.speechTranscript.trim()) { showToast('녹취록이 없습니다'); return; }
  document.getElementById('gen-btn').disabled = true;
  document.getElementById('gen-btn').textContent = '⏳ 생성 중...';

function startSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return false;

  S.recognition = new SR();
  S.recognition.lang = 'ko-KR';
  S.recognition.continuous = true;
  S.recognition.interimResults = true;

  let interim = '';

  S.recognition.onresult = (e) => {
    interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        S.speechTranscript += e.results[i][0].transcript;
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    const el = document.getElementById('live-transcript');
    if (el) el.textContent = (S.speechTranscript + interim) || '말하면 여기에 텍스트가 나타납니다...';
  };

  S.recognition.onerror = (e) => {
    if (e.error !== 'no-speech') console.log('Speech error:', e.error);
  };

  S.recognition.onend = () => {
    if (S.recording) {
      try { S.recognition.start(); } catch(e) {}
    }
  };

  try { S.recognition.start(); return true; } catch(e) { return false; }
}

function stopSpeechRecognition() {
  if (S.recognition) {
    try { S.recognition.stop(); } catch(e) {}
    S.recognition = null;
  }
}

async function generateWithClaude(transcript) {
  if (!S.anthropicKey) throw new Error('설정에서 Anthropic API 키를 먼저 입력해주세요');

  const today = new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
  const maxLen = 4000;
  const truncated = transcript.length > maxLen ? transcript.slice(0, maxLen) + '\n...(이하 생략)' : transcript;

  const prompt = `당신은 전문 회의록 작성 전문가입니다. 아래 회의 녹취록을 바탕으로 체계적인 회의록을 마크다운 형식으로 작성해주세요.

오늘 날짜: ${today}

녹취록:
${truncated}

아래 형식으로 정확히 작성해주세요:

# [회의 주제를 파악하여 간결한 제목]

## 📋 기본 정보
- **날짜**: ${today}
- **참석자**: [녹취록에서 파악된 참석자 수 또는 이름]
- **주제**: [핵심 주제 한 줄]

## 📝 회의 요약
[2-3문장으로 핵심 내용 요약]

## 💬 주요 논의사항
1. [주요 논의사항]
2. [주요 논의사항]

## ✅ 결정사항
1. [결정된 사항]

## 📌 액션아이템
| 담당자 | 내용 | 기한 |
|--------|------|------|
| [이름/담당] | [해야 할 일] | [기한] |

## 🗣️ 전체 녹취록
${truncated}

---
*Meeting Minutes App — Claude AI 자동 생성*`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': S.anthropicKey,
      'anthropic-version': '2023-06-01',
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 2048,
      messages: [{ role: 'user', content: prompt }],
    }),
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || 'Anthropic API 오류: HTTP ' + res.status);
  }
  const data = await res.json();
  const text = data.content?.[0]?.text;
  if (!text) throw new Error('Claude 응답이 비어 있습니다');
  return text;
}

// ════════════════════════════════════════
// MARKDOWN → HTML
// ════════════════════════════════════════
function mdToHtml(md) {
  if (!md) return '';
  const inl = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>');
  const lines = md.split('\n'); let html = '', inUl=false, inOl=false, inTable=false, tBuf=[];
  const flushList = () => { if(inUl){html+='</ul>';inUl=false;} if(inOl){html+='</ol>';inOl=false;} };
  const flushTable = () => {
    if(!inTable) return;
    const rows = tBuf.filter(l => !/^\|[\s\-|:]+\|$/.test(l.trim()));
    if(rows.length){ html+='<table>'; rows.forEach((row,i) => { const cells=row.split('|').slice(1,-1); if(i===0) html+='<thead><tr>'+cells.map(c=>`<th>${inl(c.trim())}</th>`).join('')+'</tr></thead><tbody>'; else html+='<tr>'+cells.map(c=>`<td>${inl(c.trim())}</td>`).join('')+'</tr>'; }); html+='</tbody></table>'; }
    tBuf=[]; inTable=false;
  };
  lines.forEach(line => {
    if(line.startsWith('|')){flushList();inTable=true;tBuf.push(line);return;} if(inTable)flushTable();
    const h1=line.match(/^# (.+)/),h2=line.match(/^## (.+)/),h3=line.match(/^### (.+)/);
    if(h1){flushList();html+=`<h1>${inl(h1[1])}</h1>`;return;} if(h2){flushList();html+=`<h2>${inl(h2[1])}</h2>`;return;} if(h3){flushList();html+=`<h3>${inl(h3[1])}</h3>`;return;}
    if(/^---+$/.test(line)){flushList();html+='<hr>';return;}
    const ul=line.match(/^[-*] (.+)/); if(ul){if(!inUl){if(inOl){html+='</ol>';inOl=false;}html+='<ul>';inUl=true;}html+=`<li>${inl(ul[1])}</li>`;return;}
    const ol=line.match(/^\d+\. (.+)/); if(ol){if(!inOl){if(inUl){html+='</ul>';inUl=false;}html+='<ol>';inOl=true;}html+=`<li>${inl(ol[1])}</li>`;return;}
    if(line.trim()===''){flushList();html+='<br>';return;} flushList(); html+=`<p>${inl(line)}</p>`;
  });
  flushList(); flushTable(); return html;
}

// ════════════════════════════════════════
// UTILS
// ════════════════════════════════════════
function fmtTimer(s) { return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function fmtDate(ts) { return new Date(ts).toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'}); }
function fmtDuration(s) { if(!s||s<1) return '-'; const m=Math.floor(s/60); return m>0?`${m}분 ${s%60}초`:`${s}초`; }
function extractTitle(text) {
  if(!text) return '회의록';
  const h1 = text.match(/^#\s+(.+)/m);
  if(h1) return h1[1].replace(/[📋📝💬✅📌📄🗣️]/gu,'').trim();
  return (text.split('\n').find(l=>l.trim())||'회의록').slice(0,45);
}
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function safeFilename(n) { return (n||'회의록').replace(/[<>:"/\\|?*\x00-\x1f]/g,'_').slice(0,60); }
function dlBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'), {href:url, download:name});
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
let _toastTm;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'show';
  clearTimeout(_toastTm); _toastTm = setTimeout(() => el.className='', 2800);
}

init();
